<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discount Calculator</title>

    <style>

        :root {

            --primary: #2563eb;

            --accent: #f97316;

            --accent-hover: #ea580c;

            --bg-main: #f8fafc;

            --surface: #ffffff;

            --text-main: #17212a;

            --text-muted: #64748b;

            --border: #e2e8f0;

            --focus-ring: rgba(37, 99, 235, 0.2);

        }

        body {

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",

                Roboto, Helvetica, Arial, sans-serif;

            max-width: 400px;

            margin: 60px auto;

            padding: 28px;

            background-color: var(--bg-main);

            color: var(--text-main);

            border: 1px solid var(--border);

            border-radius: 12px;

            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);

        }

        #container {

            margin-bottom: 20px;

        }

        h3 {

            font-size: 1.25rem;

            margin-bottom: 24px;

        }

        label {

            display: block;

            margin: 10px 0 8px;

            font-size: 0.875rem;

            font-weight: 600;

            color: var(--text-muted);

            text-transform: uppercase;

            letter-spacing: 0.05em;

        }

        input[type="number"],

        input[type="button"] {

            display: block;

            width: 100%;

            box-sizing: border-box;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 1rem;

            transition: all 0.2s ease;

        }

        input[type="number"] {

            border: 1.5px solid var(--border);

            color: var(--text-main);

            background-color: #fff;

            outline: none;

            margin-bottom: 12px;

        }

        input[type="number"]:focus {

            border-color: var(--primary);

            box-shadow: 0 0 0 3px var(--focus-ring);

        }

        output {

            display: block;

            margin: 8px 0 12px;

            font-size: 1rem;

            overflow-wrap: anywhere;

        }

        input[type="button"] {

            background-color: var(--accent);

            color: #fff;

            border: none;

            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 2px 4px rgba(249, 115, 22, 0.2);

        }

        input[type="button"]:hover {

            background-color: var(--accent-hover);

            box-shadow: 0 4px 8px rgba(249, 115, 22, 0.3);

        }

        input[type="button"]:active {

            transform: translateY(1px);

        }

        .reset-button {

            margin-top: 10px;

            background-color: #64748b !important;

        }

        .reset-button:hover {

            background-color: #475569 !important;

        }

        .programmer {

            font-size: 0.8rem;

            color: var(--text-muted);

            margin-top: 12px;

            letter-spacing: 0.03em;

        }

    </style>

</head>

<body>

    <form id="discountForm">

        <div id="container">

            <h3>Discount Calculator</h3>

            <label for="price">Price Before Discount</label>

            <input

                type="number"

                id="price"

                step="0.01"

                min="0"

                placeholder="Enter price"

                required

            >

            <label for="discount">Discount (%)</label>

            <input

                type="number"

                id="discount"

                step="0.01"

                min="0"

                max="100"

                placeholder="Enter discount percentage"

                required

            >

            <label for="priceAfter">Price After Discount</label>

            <output id="priceAfter">₱0.00</output>

            <label for="savedAmount">Saved Amount</label>

            <output id="savedAmount">₱0.00</output>

            <input type="button" id="btnCompute" value="Compute">

            <input

                type="button"

                id="btnReset"

                class="reset-button"

                value="Reset"

            >

            <p class="programmer">

                PROGRAMMED BY: Rosetine R. Luceño, G12-Cooper
            </p>

        </div>

    </form>

    <script>

        const thePrice = document.getElementById("price");

        const theDiscount = document.getElementById("discount");

        const priceAfter = document.getElementById("priceAfter");

        const savedAmount = document.getElementById("savedAmount");

        const theButton = document.getElementById("btnCompute");

        const resetButton = document.getElementById("btnReset");

        const form = document.getElementById("discountForm");

        function computeDiscount() {

            const price = parseFloat(thePrice.value);

            const discount = parseFloat(theDiscount.value);

            if (

                thePrice.value === "" ||

                theDiscount.value === "" ||

                !Number.isFinite(price) ||

                !Number.isFinite(discount) ||

                price < 0 ||

                discount < 0 ||

                discount > 100

            ) {

                alert(

                    "Please enter a valid price and a discount between 0 and 100."

                );

                return;

            }

            const saved = price * (discount / 100);

            const finalPrice = price - saved;

            priceAfter.textContent =

                "₱" + finalPrice.toFixed(2);

            savedAmount.textContent =

                "₱" + saved.toFixed(2);

        }

        theButton.addEventListener("click", computeDiscount);

        resetButton.addEventListener("click", function () {

            form.reset();

            priceAfter.textContent = "₱0.00";

            savedAmount.textContent = "₱0.00";

        });

    </script>

</body>

</html>
